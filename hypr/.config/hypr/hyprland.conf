monitor = , preferred, auto, 1.25

$scripts = ~/.dotfiles/scripts
$terminal = kitty
$fileManager = dolphin
$menu = $scripts/bemenu.sh
$browser = zen-browser
$discordClient = equibop
$discordArgs = --wayland

exec-once = waybar & swaync & hypridle & hyprpaper & $discordClient $discordArgs
bind = ALT SHIFT, D, exec, $discordClient $discordArgs
bind = ALT SHIFT, S, exec, spotify --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = ALT SHIFT, T, exec, $scripts/test.sh

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = ELECTRON_OZONE_PLATFORM_HINT, wayland

source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/workspaces.conf

# debug:disable_logs = false
