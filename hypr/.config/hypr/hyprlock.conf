general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1000
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 7%
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    # check_color = rgb(37f499)
    check_color = rgb(ebfafa)
    fail_color = rgb(f9515d)

    font_color = rgb(ebfafa)

    position = 0, -20
    halign = center
    valign = center

    rounding = 0
    fade_on_empty = true
    swap_font_color = true
}
